<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My 2026 Bookshelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📚 Sara's 2026 Bookshelf</h1>
  <div id="bookshelf"></div>
 
  <!-- Modal -->
  <div id="bookModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeBook()">&times;</span>
      <img id="cover" src="" alt="Book Cover">
      <h2 id="title"></h2>
      <h3 id="author"></h3>
      <p id="synopsis"></p>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
